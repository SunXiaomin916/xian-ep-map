<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",Roboto,sans-serif;color:#1f2937}
#app{display:flex;height:100vh;width:100%;overflow:hidden}
#sidebar{width:380px;min-width:320px;max-width:44vw;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;overflow:hidden}
.hd{padding:14px 16px 12px;border-bottom:1px solid #eef0f3}
.hd .title{font-size:17px;font-weight:700}
.hd .sub{font-size:12px;color:#6b7280;margin-top:3px}
.hd .sub b{color:#1d4ed8}
.controls{padding:12px 16px;border-bottom:1px solid #eef0f3;display:flex;flex-direction:column;gap:9px}
.search{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;outline:none}
.search:focus{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.15)}
.row{display:flex;align-items:center;gap:8px}
.row>label{font-size:12px;color:#374151;width:56px;flex:0 0 auto}
.row select{flex:1;padding:7px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;background:#fff;outline:none}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:7px 0;border:1px solid #d1d5db;border-radius:6px;background:#fff;font-size:13px;cursor:pointer}
.seg button.active{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.check{display:flex;align-items:center;justify-content:space-between}
.check label{font-size:13px;color:#374151;display:flex;align-items:center;gap:6px;cursor:pointer}
.ghost{padding:6px 14px;border:1px solid #d1d5db;border-radius:6px;background:#f9fafb;font-size:12px;cursor:pointer}
.ghost:hover{background:#eef2f7}
.list{flex:1;overflow-y:auto;padding:8px}
.item{padding:9px 10px;border:1px solid #eef0f3;border-radius:7px;margin-bottom:7px;cursor:pointer;transition:background .12s}
.item:hover{background:#eff6ff;border-color:#bfdbfe}
.item.bad{background:#fff7f7;border-color:#fecaca}
.item-t{font-size:13px;font-weight:600;line-height:1.4}
.item-m{font-size:11px;color:#6b7280;margin-top:2px}
.item-l{font-size:11px;color:#9ca3af;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;padding:0 6px;border-radius:3px;font-size:10px;font-weight:600;vertical-align:1px;margin-left:5px}
.tag.bad{background:#fee2e2;color:#b91c1c}
.empty{padding:40px 0;text-align:center;color:#9ca3af;font-size:13px}
.more{padding:10px;text-align:center;color:#9ca3af;font-size:12px}
.ft{padding:8px 16px;border-top:1px solid #eef0f3;font-size:11px;color:#9ca3af;line-height:1.5}
#map{flex:1;height:100%;background:#e8ecf1}
.iw{max-width:300px;font-size:12px;color:#1f2937}
.iw-t{font-size:14px;font-weight:700;margin-bottom:6px;color:#111827}
.iw-r{display:flex;gap:6px;margin:3px 0;line-height:1.5}
.iw-r span{flex:0 0 60px;color:#6b7280}
.iw-a{display:inline-block;margin-top:6px;color:#1d4ed8;text-decoration:none}
.iw-a:hover{text-decoration:underline}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;display:none;z-index:9999;max-width:80vw}
@media(max-width:720px){#app{flex-direction:column}#sidebar{width:100%;max-width:none;height:46vh}#map{height:54vh}}

/* ===== 限行导航 ===== */
.nav-section{border-bottom:1px solid #eef0f3;background:#fff}
.nav-toggle{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;user-select:none}
.nav-toggle:hover{background:#f8fafc}
.nav-arrow{color:#6b7280;font-size:12px;transition:transform .15s}
.nav-content{padding:4px 16px 14px;display:none}
.nav-section.open .nav-content{display:block}
.nav-section.open .nav-arrow{transform:rotate(180deg)}
.nav-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.nav-row label{width:36px;font-size:13px;color:#374151;flex:0 0 auto}
.nav-row input{flex:1;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;outline:none}
.nav-row input:focus{border-color:#3b82f6}
.mini{padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff;font-size:12px;cursor:pointer;white-space:nowrap}
.mini.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.nav-mode{display:flex;gap:6px;margin:12px 0}
.nav-mode button{flex:1;padding:8px 0;border:1px solid #d1d5db;border-radius:6px;background:#fff;font-size:13px;cursor:pointer}
.nav-mode button.active{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.nav-actions{display:flex;gap:6px}
.primary{flex:1;padding:10px;border:none;border-radius:8px;background:#16a34a;color:#fff;font-size:14px;cursor:pointer}
.secondary{padding:10px 18px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:#374151;font-size:14px;cursor:pointer}
.secondary:hover{background:#f3f4f6}
.secondary:disabled{opacity:.45;cursor:not-allowed;background:#f3f4f6;color:#9ca3af}
.nav-result{margin-top:14px;border-top:1px solid #eef0f3;padding-top:12px;font-size:13px}
.nr-line{margin:4px 0}
.nr-line b.red{color:#dc2626}
.nr-list{max-height:180px;overflow:auto;margin-top:6px;border:1px solid #eef0f3;border-radius:6px}
.nr-item{padding:5px 8px;cursor:pointer;font-size:12px;border-bottom:1px solid #f1f5f9}
.nr-item:hover{background:#eff6ff}
.nr-tip{margin-top:6px;color:#9ca3af;font-size:11px}

/* ===== 尾号限行查询 ===== */
.nav-restrict{margin:12px 0;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px}
.nr-title{font-size:13px;font-weight:700;margin-bottom:8px;color:#1f2937}
.plate-result{font-size:13px;margin-top:8px;line-height:1.7}
.plate-info{color:#6b7280}
.plate-ok{color:#16a34a;font-weight:600}
.plate-no{color:#dc2626;font-weight:600}
.plate-warn{color:#d97706}
.plate-week{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pw-item{font-size:11px;padding:3px 8px;border-radius:4px;background:#eef2f7;color:#475569}
.pw-item.today{background:#1d4ed8;color:#fff;font-weight:700}
.plate-note{font-size:11px;color:#9ca3af;margin-top:6px;line-height:1.5}

/* ===== 点位查询折叠区块 ===== */
.query-section{display:flex;flex-direction:column;flex:1;min-height:0;background:#fff}
.query-toggle{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;user-select:none}
.query-toggle:hover{background:#f8fafc}
.query-arrow{color:#6b7280;font-size:12px;transition:transform .15s}
.query-content{display:none;flex-direction:column;flex:1;min-height:0}
.query-section.open .query-content{display:flex}
.query-section.open .query-arrow{transform:rotate(180deg)}
</style>

function xPi(){ return Math.PI * 3000.0 / 180.0; }
function outChina(lng, lat){ return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271; }
function tLat(x, y){
  var r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
  r += (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI)) * 2/3;
  r += (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30)) * 2/3;
  return r;
}
function tLng(x, y){
  var r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
  r += (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI)) * 2/3;
  r += (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI)) * 2/3;
  return r;
}
function wgs2gcj(lng, lat){
  if (outChina(lng, lat)) return [lng, lat];
  var a = 6378245.0, ee = 0.00669342162296594323;
  var dLat = tLat(lng - 105, lat - 35);
  var dLng = tLng(lng - 105, lat - 35);
  var rl = lat / 180 * Math.PI;
  var m = Math.sin(rl); m = 1 - ee*m*m; var sm = Math.sqrt(m);
  dLat = (dLat * 180) / ((a * (1 - ee)) / (m * sm) * Math.PI);
  dLng = (dLng * 180) / (a / sm * Math.cos(rl) * Math.PI);
  return [lng + dLng, lat + dLat];
}
function gcj2bd(lng, lat){
  var z = Math.sqrt(lng*lng + lat*lat) + 0.00002 * Math.sin(lat * xPi());
  var th = Math.atan2(lat, lng) + 0.000003 * Math.cos(lng * xPi());
  return [z * Math.cos(th) + 0.0065, z * Math.sin(th) + 0.006];
}
function toBd(p){ return [p.x, p.y]; }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.style.display = 'none'; }, 2600);
}

function buildOptions(){
  var areaCount = {};
  DATA.forEach(function(p){ areaCount[p.a] = (areaCount[p.a]||0) + 1; });
  var areas = Object.keys(areaCount).sort(function(x,y){ return areaCount[y]-areaCount[x]; });
  var asel = document.getElementById('area');
  asel.innerHTML = '<option value="">全部区域</option>';
  areas.forEach(function(a){ var o=document.createElement('option'); o.value=a; o.textContent=a+' ('+areaCount[a]+')'; asel.appendChild(o); });

  var catCount = {};
  DATA.forEach(function(p){ (p.c||[]).forEach(function(c){ catCount[c]=(catCount[c]||0)+1; }); });
  var cats = Object.keys(catCount).sort(function(x,y){ return catCount[y]-catCount[x]; });
  var csel = document.getElementById('cat');
  csel.innerHTML = '<option value="">全部违法类型</option>';
  cats.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c+' ('+catCount[c]+')'; csel.appendChild(o); });
}

function filtered(){
  var q = state.q.toLowerCase();
  return DATA.filter(function(p){
    if (state.area && p.a !== state.area) return false;
    if (state.cat && (p.c||[]).indexOf(state.cat) < 0) return false;
    if (state.status !== ''){
      if (state.status === 'empty'){ if (p.s !== '') return false; }
      else if (p.s !== state.status) return false;
    }
    if (q){
      var hay = (p.n + ' ' + p.l + ' ' + p.a + ' ' + p.r + ' ' + (p.c||[]).join(' ')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

function infoHTML(p){
  var cats = (p.c||[]).join('、');
  var b = toBd(p);
  var baidu = 'https://api.map.baidu.com/marker?location=' + b[1] + ',' + b[0] + '&title=' + encodeURIComponent(p.n) + '&content=' + encodeURIComponent(p.l) + '&output=html';
  return '<div class="iw">'
    + '<div class="iw-t">' + esc(p.n) + '</div>'
    + '<div class="iw-r"><span>位置</span>' + esc(p.l) + '</div>'
    + '<div class="iw-r"><span>区域</span>' + esc(p.a) + '</div>'
    + '<div class="iw-r"><span>违法内容</span>' + esc(p.r) + '</div>'
    + '<div class="iw-r"><span>分类</span>' + esc(cats) + '</div>'
    + '<div class="iw-r"><span>状态码</span>' + (p.s === '' ? '空' : esc(p.s)) + '</div>'
    + '<div class="iw-r"><span>坐标</span>' + b[0].toFixed(6) + ', ' + b[1].toFixed(6) + '（百度）</div>'
    + '<div class="iw-r"><span>原始</span>' + (p.raw ? p.raw[0] + ', ' + p.raw[1] : '') + '（' + (p.sys === 'gcj' ? 'GCJ-02' : 'WGS-84') + '）</div>'
    + '<a class="iw-a" target="_blank" href="' + baidu + '">在百度地图中查看 ↗</a>'
    + '</div>';
}
function openInfo(p, pt){
  var iw = new BMap.InfoWindow(infoHTML(p), { width: 320 });
  map.openInfoWindow(iw, pt);
}
function makeMarker(p){
  var b = toBd(p);
  var pt = new BMap.Point(b[0], b[1]);
  var mk = new BMap.Marker(pt);
  mk.addEventListener('click', function(){ openInfo(p, pt); });
  return mk;
}
function makeMarkers(list){
  var ms = [];
  for (var i=0;i<list.length;i++){ if (!list[i].bad) ms.push(makeMarker(list[i])); }
  return ms;
}
function renderList(list){
  var el = document.getElementById('list');
  el.innerHTML = '';
  if (!list.length){ el.innerHTML = '<div class="empty">没有匹配的点位</div>'; return; }
  var n = Math.min(list.length, LIST_LIMIT);
  for (var i=0;i<n;i++){
    (function(p){
      var item = document.createElement('div');
      item.className = 'item' + (p.bad ? ' bad' : '');
      var cats = (p.c||[]).join('、');
      var badge = p.bad ? '<span class="tag bad">坐标异常</span>' : '';
      item.innerHTML = '<div class="item-t">' + esc(p.n) + badge + '</div>'
        + '<div class="item-m">' + esc(p.a) + ' · ' + esc(cats) + ' · 状态' + (p.s===''?'空':esc(p.s)) + '</div>'
        + '<div class="item-l">' + esc(p.l) + '</div>';
      item.addEventListener('click', function(){ locate(p); });
      el.appendChild(item);
    })(list[i]);
  }
  if (list.length > n){
    var more = document.createElement('div');
    more.className = 'more';
    more.textContent = '仅显示前 ' + n + ' 条，请用筛选/搜索缩小范围（共 ' + list.length + ' 条）';
    el.appendChild(more);
  }
}
function locate(p){
  if (p.bad){ toast('该点位源数据坐标异常，无法定位：' + p.n); return; }
  var b = toBd(p);
  var pt = new BMap.Point(b[0], b[1]);
  map.centerAndZoom(pt, 16);
  openInfo(p, pt);
}
function updateCounts(list){
  document.getElementById('totalAll').textContent = DATA.length;
  document.getElementById('totalNow').textContent = list.length;
  document.getElementById('badCount').textContent = badTotal;
}
function clearAll(){
  if (clusterer){ try{ clusterer.clearMarkers(); }catch(e){} clusterer = null; }
  for (var i=0;i<plainMarkers.length;i++){ try{ map.removeOverlay(plainMarkers[i]); }catch(e){} }
  plainMarkers = [];
  if (heatmap){ try{ map.removeOverlay(heatmap); }catch(e){} heatmap = null; }
}
function rebuild(){
  clearAll();
  var list = filtered();
  updateCounts(list);
  renderList(list);
  if (state.mode === 'heat'){
    if (window.BMapLib && BMapLib.HeatmapOverlay){
      var pts = [];
      for (var i=0;i<list.length;i++){ if (!list[i].bad){ var _b = toBd(list[i]); pts.push({ lng: _b[0], lat: _b[1], count: 1 }); } }
      heatmap = new BMapLib.HeatmapOverlay({ radius: 22, opacity: 0.7 });
      map.addOverlay(heatmap);
      heatmap.setDataSet({ data: pts, max: 12 });
    } else { toast('热力图组件加载失败'); }
  } else {
    var ms = makeMarkers(list);
    if (state.cluster && window.BMapLib && BMapLib.MarkerClusterer){
      clusterer = new BMapLib.MarkerClusterer(map, { markers: ms, gridSize: 70 });
    } else {
      plainMarkers = ms;
      for (var j=0;j<plainMarkers.length;j++) map.addOverlay(plainMarkers[j]);
    }
  }
}
function setMode(m){
  state.mode = m;
  document.getElementById('modeMarker').className = (m==='marker') ? 'active' : '';
  document.getElementById('modeHeat').className = (m==='heat') ? 'active' : '';
  document.getElementById('clusterRow').style.display = (m==='marker') ? '' : 'none';
  rebuild();
}
function resetAll(){
  state = { q:'', area:'', cat:'', status:'', mode:'marker', cluster:true };
  document.getElementById('q').value = '';
  document.getElementById('area').value = '';
  document.getElementById('cat').value = '';
  document.getElementById('status').value = '';
  document.getElementById('cluster').checked = true;
  setMode('marker');
}
var badTotal = 0;
function init(){
  badTotal = DATA.filter(function(p){ return p.bad; }).length;
  buildOptions();
  if (typeof BMap === 'undefined'){ toast('百度地图加载失败，请检查网络或 AK 是否有效'); return; }
  map = new BMap.Map('map');
  map.centerAndZoom(new BMap.Point(MAP_CENTER[0], MAP_CENTER[1]), MAP_ZOOM);
  map.enableScrollWheelZoom(true);
  map.addControl(new BMap.NavigationControl({ anchor: BMAP_ANCHOR_TOP_RIGHT }));
  map.addControl(new BMap.ScaleControl());
  map.addControl(new BMap.MapTypeControl());
  document.getElementById('q').addEventListener('input', function(){ state.q = this.value; rebuild(); });
  document.getElementById('area').addEventListener('change', function(){ state.area = this.value; rebuild(); });
  document.getElementById('cat').addEventListener('change', function(){ state.cat = this.value; rebuild(); });
  document.getElementById('status').addEventListener('change', function(){ state.status = this.value; rebuild(); });
  document.getElementById('cluster').addEventListener('change', function(){ state.cluster = this.checked; rebuild(); });
  document.getElementById('modeMarker').addEventListener('click', function(){ setMode('marker'); });
  document.getElementById('modeHeat').addEventListener('click', function(){ setMode('heat'); });
  document.getElementById('reset').addEventListener('click', resetAll);
  rebuild();
}

  var sec = document.getElementById('navSection');
  var open = sec.classList.toggle('open');
  if (open) renderPlateWeek();
}
function navStopPicking(){
  NAV.picking = null;
  document.getElementById('pickStart').className = 'mini';
  document.getElementById('pickEnd').className = 'mini';
}
function navPick(which){
  NAV.picking = which;
  document.getElementById('pickStart').className = 'mini' + (which==='start'?' on':'');
  document.getElementById('pickEnd').className = 'mini' + (which==='end'?' on':'');
  toast('请在地图上点击' + (which==='start'?'起点':'终点'));
}
function navSetMode(m){
  NAV.mode = m;
  document.getElementById('modeNormal').className = m==='normal' ? 'active' : '';
  document.getElementById('modeAvoid').className = m==='avoid' ? 'active' : '';
}
function navOnMapClick(e){
  if (!NAV.picking) return;
  var which = NAV.picking;
  if (which==='start'){ NAV.startPt = e.point; document.getElementById('navStart').value = e.point.lng.toFixed(6) + ',' + e.point.lat.toFixed(6); }
  else { NAV.endPt = e.point; document.getElementById('navEnd').value = e.point.lng.toFixed(6) + ',' + e.point.lat.toFixed(6); }
  navStopPicking(); navDrawPins();
  toast((which==='start'?'起点':'终点') + '已设置');
}
function navDrawPins(){
  if (NAV._sp){ map.removeOverlay(NAV._sp); NAV._sp = null; }
  if (NAV._ep){ map.removeOverlay(NAV._ep); NAV._ep = null; }
  if (NAV.startPt){ NAV._sp = new BMap.Marker(NAV.startPt); map.addOverlay(NAV._sp); }
  if (NAV.endPt){ NAV._ep = new BMap.Marker(NAV.endPt); map.addOverlay(NAV._ep); }
}
function updateClearBtn(){
  var btn = document.getElementById('navClearBtn');
  btn.disabled = !(NAV.overlays.length > 0);
}
function navClear(){
  for (var i=0;i<NAV.overlays.length;i++){ try{ map.removeOverlay(NAV.overlays[i]); }catch(e){} }
  NAV.overlays = [];
  var res = document.getElementById('navResult');
  res.style.display = 'none'; res.innerHTML = '';
  updateClearBtn();
}
function parseDist(s){ s = String(s); var m = s.match(/([\d.]+)\s*公里/); if (m) return parseFloat(m[1])*1000; m = s.match(/([\d.]+)\s*米/); if (m) return parseFloat(m[1]); return 0; }
function parseDur(s){ s = String(s); var m = s.match(/([\d.]+)\s*分钟/); if (m) return parseFloat(m[1]); m = s.match(/([\d.]+)\s*小时/); if (m) return parseFloat(m[1])*60; return 0; }
function segDist(p, a, b){
  var dx = b[0]-a[0], dy = b[1]-a[1];
  var len2 = dx*dx + dy*dy;
  if (len2 === 0) return Math.sqrt((p[0]-a[0])*(p[0]-a[0]) + (p[1]-a[1])*(p[1]-a[1]));
  var t = ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / len2;
  if (t < 0) t = 0; else if (t > 1) t = 1;
  var x = a[0]+t*dx, y = a[1]+t*dy;
  return Math.sqrt((p[0]-x)*(p[0]-x) + (p[1]-y)*(p[1]-y));
}
function pathDist(p, pts){
  var min = Infinity;
  for (var i=0;i<pts.length-1;i++){ var d = segDist(p, pts[i], pts[i+1]); if (d < min) min = d; }
  return min;
}
function countCams(path, buffer){
  var pts = path.map(function(p){ return [p[0]*M_LNG, p[1]*M_LAT]; });
  var hits = [];
  for (var i=0;i<XIANXING_CAMS.length;i++){
    var c = XIANXING_CAMS[i];
    if (pathDist([c.x*M_LNG, c.y*M_LAT], pts) <= buffer) hits.push(c);
  }
  return hits;
}
function resolveOne(which, cb){
  var pt = which==='start' ? NAV.startPt : NAV.endPt;
  if (pt){ cb(pt); return; }
  var el = document.getElementById(which==='start'?'navStart':'navEnd');
  var txt = el.value.trim();
  if (!txt){ toast('请先设置' + (which==='start'?'起点':'终点')); cb(null); return; }
  new BMap.Geocoder().getPoint(txt, function(p){ if (p) cb(p); else { toast('无法解析：' + txt); cb(null); } });
}
function navGo(){
  document.getElementById('navResult').style.display = 'none';
  resolveOne('start', function(sp){ if (!sp) return; resolveOne('end', function(ep){ if (!ep) return; toast('路线计算中…'); navClear(); computeRoutes(sp, ep); }); });
}
function dedupe(routes){
  var uniq = []; var seen = {};
  for (var i=0;i<routes.length;i++){
    if (!routes[i] || !routes[i].path || !routes[i].path.length) continue;
    var key = routes[i].path.map(function(p){ return p[0].toFixed(5)+','+p[1].toFixed(5); }).join(';');
    if (seen[key]) continue; seen[key] = 1; uniq.push(routes[i]);
  }
  return uniq;
}
function routeSearch(sp, ep, opts){
  return new Promise(function(resolve){
    var routes = [];
    var dr = new BMap.DrivingRoute(map, {
      onSearchComplete: function(results){
        try {
          var np = results.getNumPlans();
          for (var i=0;i<np;i++){
            var plan = results.getPlan(i);
            var nr = plan.getNumRoutes();
            var fullPath = [];
            for (var j=0;j<nr;j++){
              fullPath = fullPath.concat(plan.getRoute(j).getPath().map(function(pt){ return [pt.lng, pt.lat]; }));
            }
            routes.push({ path: fullPath, distStr: plan.getDistance(), durStr: plan.getDuration(), distM: parseDist(plan.getDistance()), durM: parseDur(plan.getDuration()) });
          }
        } catch(e){}
        resolve(routes);
      }
    });
    if (opts.waypoints) dr.search(sp, ep, { waypoints: opts.waypoints });
    else dr.search(sp, ep, { policy: opts.policy });
  });
}
function detourWaypoint(cam, path){
  var cpx = cam.x * M_LNG, cpy = cam.y * M_LAT;
  var bestA = null, bestB = null, bestD = Infinity;
  for (var i=0;i<path.length-1;i++){
    var a = [path[i][0]*M_LNG, path[i][1]*M_LAT];
    var b = [path[i+1][0]*M_LNG, path[i+1][1]*M_LAT];
    var d = segDist([cpx,cpy], a, b);
    if (d < bestD){ bestD = d; bestA = a; bestB = b; }
  }
  if (!bestA || !bestB) return null;
  var dx = bestB[0]-bestA[0], dy = bestB[1]-bestA[1];
  var len = Math.sqrt(dx*dx+dy*dy) || 1;
  var px = -dy/len, py = dx/len;
  var wx = cpx + px*500, wy = cpy + py*500;
  return [wx/M_LNG, wy/M_LAT];
}
async function computeRoutes(sp, ep){
  var candidates = [];
  var normal = (await routeSearch(sp, ep, { policy: BMAP_DRIVING_POLICY_LEAST_TIME }))[0];
  if (normal) candidates.push(normal);
  candidates = candidates.concat(await routeSearch(sp, ep, { policy: BMAP_DRIVING_POLICY_LEAST_DISTANCE }));
  candidates = candidates.concat(await routeSearch(sp, ep, { policy: BMAP_DRIVING_POLICY_AVOID_HIGHWAYS }));
  if (NAV.mode === 'avoid' && normal){
    var cams = countCams(normal.path, 100);
    for (var i=0;i<Math.min(cams.length, 4);i++){
      var wp = detourWaypoint(cams[i], normal.path);
      if (wp){ candidates = candidates.concat(await routeSearch(sp, ep, { waypoints: [new BMap.Point(wp[0], wp[1])] })); }
    }
  }
  var uniq = dedupe(candidates);
  if (!uniq.length){ toast('未获取到路线，请重试'); return; }
  for (var j=0;j<uniq.length;j++){ uniq[j].cams = countCams(uniq[j].path, 100); }
  var normalRoute = uniq.slice().sort(function(a,b){ return a.durM - b.durM; })[0];
  var avoidRoute = uniq.slice().sort(function(a,b){ return a.cams.length - b.cams.length || a.durM - b.durM; })[0];
  var chosen = NAV.mode === 'avoid' ? avoidRoute : normalRoute;
  renderRoute(chosen, normalRoute, avoidRoute, uniq.length);
}
function renderRoute(chosen, normalRoute, avoidRoute, altCount){
  var color = NAV.mode==='avoid' ? '#16a34a' : '#2563eb';
  var polyline = new BMap.Polyline(chosen.path.map(function(p){ return new BMap.Point(p[0], p[1]); }), { strokeColor: color, strokeWeight: 5, strokeOpacity: 0.85 });
  map.addOverlay(polyline); NAV.overlays.push(polyline);
  for (var i=0;i<chosen.cams.length;i++){
    var c = chosen.cams[i];
    var circle = new BMap.Circle(new BMap.Point(c.x, c.y), 40, { strokeColor:'#dc2626', strokeWeight:1, strokeOpacity:0.8, fillColor:'#ef4444', fillOpacity:0.28 });
    map.addOverlay(circle); NAV.overlays.push(circle);
  }
  var res = document.getElementById('navResult');
  var html = '<div class="nr-line">模式：<b>' + (NAV.mode==='avoid' ? '避开限行监控' : '正常导航') + '</b>（候选路线 ' + altCount + ' 条）</div>'
    + '<div class="nr-line">距离：<b>' + esc(chosen.distStr) + '</b> · 用时：<b>' + esc(chosen.durStr) + '</b></div>'
    + '<div class="nr-line">途经限行监控：<b class="red">' + chosen.cams.length + '</b> 个（全市共 ' + XIANXING_CAMS.length + ' 个限行点位）</div>';
  if (NAV.mode === 'avoid' && avoidRoute && normalRoute){
    html += '<div class="nr-line" style="color:#6b7280">正常导航参考：途经 ' + normalRoute.cams.length + ' 个' + (normalRoute.cams.length > avoidRoute.cams.length ? '，可减少 ' + (normalRoute.cams.length - avoidRoute.cams.length) + ' 个' : '') + '</div>';
  }
  if (chosen.cams.length){
    html += '<div class="nr-list">';
    for (var k=0;k<Math.min(chosen.cams.length, 8);k++){
      var cc = chosen.cams[k];
      html += '<div class="nr-item" data-fid="' + cc.i + '">' + esc(cc.n) + '（' + esc(cc.a) + '）</div>';
    }
    if (chosen.cams.length > 8) html += '<div class="nr-item">… 还有 ' + (chosen.cams.length - 8) + ' 个</div>';
    html += '</div>';
  }
  if (plateIsRestricted()) html += '<div class="nr-line" style="color:#d97706">提示：您的车牌今日限行，本路线仅供参考（不作强制）</div>';
  html += '<div class="nr-tip">蓝色=正常路线 · 绿色=避开路线 · 红色圆圈=途经限行监控点位（点击下方列表可定位）</div>';
  res.innerHTML = html; res.style.display = 'block';
  var items = res.querySelectorAll('.nr-item[data-fid]');
  for (var m=0;m<items.length;m++){
    (function(el){
      var fid = el.getAttribute('data-fid');
      el.addEventListener('click', function(){ var p = DATA.find(function(x){ return x.i===fid; }); if (p){ map.centerAndZoom(new BMap.Point(p.x, p.y), 16); } });
    })(items[m]);
  }
  map.setViewport(chosen.path.map(function(p){ return new BMap.Point(p[0], p[1]); }));
  updateClearBtn();
}
document.getElementById('navToggle').addEventListener('click', navToggle);
document.getElementById('pickStart').addEventListener('click', function(){ navPick('start'); });
document.getElementById('pickEnd').addEventListener('click', function(){ navPick('end'); });
document.getElementById('modeNormal').addEventListener('click', function(){ navSetMode('normal'); });
document.getElementById('modeAvoid').addEventListener('click', function(){ navSetMode('avoid'); });
document.getElementById('navGo').addEventListener('click', navGo);
function navClearAll(){
  navClear();
  if (NAV._sp){ map.removeOverlay(NAV._sp); NAV._sp = null; }
  if (NAV._ep){ map.removeOverlay(NAV._ep); NAV._ep = null; }
  NAV.startPt = null; NAV.endPt = null;
  document.getElementById('navStart').value = '';
  document.getElementById('navEnd').value = '';
  toast('已清除导航路线');
}
document.getElementById('navClearBtn').addEventListener('click', navClearAll);


// ===== 尾号限行查询 =====
var RESTRICT = { 1:[1,6], 2:[2,7], 3:[3,8], 4:[4,9], 5:[5,0] };
var RESTRICT_DAY = ['日','一','二','三','四','五','六'];
function getRestrictionInfo(){
  var now = new Date();
  var day = now.getDay();
  var isWorkday = day >= 1 && day <= 5;
  return { day: day, isWorkday: isWorkday, restricted: isWorkday ? RESTRICT[day] : [] };
}
function plateInfo(input){
  var s = String(input||'').replace(/[··\s.\-]/g, '').toUpperCase();
  if (!s) return { tail:null, isNewEnergy:false };
  var core = s.slice(2);
  var isNewEnergy = /^[DF]/.test(core) && s.length === 8;
  var digits = s.replace(/[^0-9]/g, '');
  var tail = digits ? parseInt(digits.charAt(digits.length-1)) : null;
  return { tail: tail, isNewEnergy: isNewEnergy };
}
function renderPlateWeek(){
  var ri = getRestrictionInfo();
  var html = '';
  for (var d=1; d<=5; d++){
    var nums = RESTRICT[d];
    var cls = d === ri.day ? 'pw-item today' : 'pw-item';
    html += '<span class="' + cls + '">周' + RESTRICT_DAY[d] + ' ' + nums.join('、') + '</span>';
  }
  document.getElementById('plateWeek').innerHTML = html;
  if (!ri.isWorkday){
    document.getElementById('plateResult').innerHTML = '<div class="plate-ok">今日为周末/节假日，不限行 ✓</div>';
  } else {
    document.getElementById('plateResult').innerHTML = '<div class="plate-info">今日限行尾号：<b>' + ri.restricted.join('、') + '</b></div>';
  }
}
function plateIsRestricted(){
  var info = plateInfo(document.getElementById('plateInput').value);
  if (info.isNewEnergy || !info.tail) return false;
  var ri = getRestrictionInfo();
  return ri.isWorkday && ri.restricted.indexOf(info.tail) >= 0;
}
function checkPlate(){
  var input = document.getElementById('plateInput').value;
  var info = plateInfo(input);
  var ri = getRestrictionInfo();
  var r = document.getElementById('plateResult');
  if (!input.trim()){ renderPlateWeek(); return; }
  var line = '<div class="plate-info">今日限行尾号：<b>' + (ri.restricted.length ? ri.restricted.join('、') : '—') + '</b></div>';
  var status;
  if (info.isNewEnergy) status = '<div class="plate-ok">新能源号牌，不受尾号限行限制 ✓</div>';
  else if (!ri.isWorkday) status = '<div class="plate-ok">今日为周末/节假日，不限行 ✓</div>';
  else if (info.tail === null) status = '<div class="plate-warn">无法识别车牌尾号，请检查输入</div>';
  else if (ri.restricted.indexOf(info.tail) >= 0) status = '<div class="plate-no">尾号 <b>' + info.tail + '</b> 今日限行 ✗（7:00–20:00）</div>';
  else status = '<div class="plate-ok">尾号 <b>' + info.tail + '</b> 今日不限行 ✓</div>';
  r.innerHTML = line + status;
}
document.getElementById('plateCheck').addEventListener('click', checkPlate);
document.getElementById('plateInput').addEventListener('input', checkPlate);
renderPlateWeek();

document.getElementById('queryToggle').addEventListener('click', function(){ document.getElementById('querySection').classList.toggle('open'); });
window.onload = init;
